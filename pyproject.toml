[project]
name = "engyt"
version = "0.1.0"
description = "YouTube URL -> English learning lesson ZIP (MP3 + en/ja text + word timings)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch",
  "qwen-asr",
  "yt-dlp[default]",
  "httpx",
  "huggingface_hub",
  "numpy",
  "soundfile",
  "tomli-w",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
packages = ["engyt"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
