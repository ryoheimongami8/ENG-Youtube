<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ENG-Youtube</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="back" hidden aria-label="戻る">‹</button>
  <h1 id="title">ENG-Youtube</h1>
</header>

<main id="library">
  <label class="import">
    教材ZIPを取り込む
    <input id="file" type="file" accept=".zip,application/zip" multiple hidden>
  </label>
  <p id="msg" role="status"></p>
  <ul id="lessons"></ul>
  <p class="hint">教材はこの端末に保存され、オフラインで使えます。</p>
</main>

<main id="player" hidden>
  <div id="sentences"></div>
</main>

<footer id="controls" hidden>
  <div class="row">
    <button id="prev" aria-label="前の文">⏮</button>
    <button id="play" aria-label="再生/停止">▶</button>
    <button id="next" aria-label="次の文">⏭</button>
    <select id="rate" aria-label="速度">
      <option value="0.5">0.5x</option><option value="0.7">0.7x</option><option value="0.85">0.85x</option>
      <option value="1" selected>1.0x</option><option value="1.15">1.15x</option><option value="1.3">1.3x</option><option value="1.5">1.5x</option>
    </select>
  </div>
  <div class="row">
    <label><input id="repeat" type="checkbox"> 文リピート</label>
    <select id="rcount" aria-label="リピート回数">
      <option value="2">2回</option><option value="3">3回</option><option value="5">5回</option><option value="0" selected>無限</option>
    </select>
    <label><input id="showJa" type="checkbox" checked> 訳</label>
  </div>
</footer>
<audio id="audio" preload="auto"></audio>
<script src="fflate.js"></script>
<script src="app.js"></script>
</body>
</html>
